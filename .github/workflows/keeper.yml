# Runs the VICE keeper every 15 minutes (GitHub may delay scheduled runs a little).
# Setup (once, in the repo's Settings → Secrets and variables → Actions):
#   secret   KEEPER_PRIVATE_KEY  a NEW wallet used only for this, holding ~1 HYPE for gas
#   variable VICE_VAULT          the vault address (optional: otherwise read from web/lib/config.ts)
# Until the city is live the job does nothing. "Run workflow" on the Actions tab runs it by hand.
name: keeper
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
concurrency:
  group: keeper
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: keeper
      - run: node keeper.mjs
        working-directory: keeper
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          VICE_VAULT: ${{ vars.VICE_VAULT }}
